glob_matcher: doublestar
post-merge:
  jobs:
    - name: prepare
      script: prepare.sh
      runner: bash
pre-push:
  jobs:
    - name: check
      script: check.sh
      runner: bash
pre-commit:
  jobs:
    - name: cleanup
      glob: '**/*.{astro,cjs,css,cts,gql,graphql,hbs,htm,html,java,js,json,json5,jsonc,jsx,less,md,mdx,mjs,mts,py,scss,svelte,toml,ts,tsx,vue,yaml,yml}'
      run: bun wb lint --fix --format -- {staged_files}
      stage_fixed: true
    - name: normalize-bun-lockfile
      glob: bun.lock
      run: bash .lefthook/normalize-bun-lockfile.sh {staged_files}
      stage_fixed: true
