  <!--
    Wordmark set in Montserrat Bold (SIL Open Font License 1.1), converted to outlines so that it
    renders identically everywhere (an SVG shown as <img> cannot load web fonts).

    To regenerate (e.g. after changing the text, size, or letter-spacing):
    1. Download Montserrat-Bold.ttf from https://github.com/JulietaUla/Montserrat (fonts/ttf/).
    2. Run the Python script below with the packages fontTools and uharfbuzz available
       (for example via "uv run" with those two packages added as dependencies).
    3. Replace the two <path d="..."> values below with its output, and the x1/y1/x2/y2 of the
       #blue and #yellow gradients in <defs> with the printed values.

    import re, uharfbuzz as hb
    from fontTools.ttLib import TTFont
    from fontTools.pens.svgPathPen import SVGPathPen
    from fontTools.pens.transformPen import TransformPen
    from fontTools.pens.boundsPen import BoundsPen
    FONT = 'Montserrat-Bold.ttf'
    SIZE, BASELINE, CENTER_X = 200, 612, 960     # font size (px), baseline y, horizontal center
    TRACKING = 0.01 * SIZE                       # letter-spacing: 0.01em
    WORDS = [('slidev-', 'blue'), ('check', 'yellow')]
    font = TTFont(FONT); scale = SIZE / font['head'].unitsPerEm
    glyphs, names = font.getGlyphSet(), font.getGlyphOrder()
    hbfont = hb.Font(hb.Face(hb.Blob.from_file_path(FONT)))
    def shape(text):                             # HarfBuzz shaping, with kerning
        buf = hb.Buffer(); buf.add_str(text); buf.guess_segment_properties()
        hb.shape(hbfont, buf, {'kern': True, 'liga': True})
        return [(names[i.codepoint], p.x_advance, p.x_offset, p.y_offset)
                for i, p in zip(buf.glyph_infos, buf.glyph_positions)]
    shaped = [shape(w) for w, _ in WORDS]
    total = sum(adv * scale + TRACKING for g in shaped for _, adv, _, _ in g) - TRACKING
    x = CENTER_X - total / 2                     # center the whole wordmark
    for (word, gid), run in zip(WORDS, shaped):
        pen, bounds = SVGPathPen(glyphs), BoundsPen(glyphs)
        for name, adv, dx, dy in run:
            t = (scale, 0, 0, -scale, x + dx * scale, BASELINE - dy * scale)  # flip y, place glyph
            glyphs[name].draw(TransformPen(pen, t)); glyphs[name].draw(TransformPen(bounds, t))
            x += adv * scale + TRACKING
        d = re.sub(r'-?\d+\.\d+', lambda m: f'{float(m.group()):.1f}'.rstrip('0').rstrip('.'), pen.getCommands())
        x0, y0, x1, y1 = bounds.bounds
        # 45-degree gradient from the word's bottom-left corner towards its top-right corner
        length = ((x1 - x0) + (y1 - y0)) / 2
        print(gid, f'x1="{x0:.0f}" y1="{y1:.0f}" x2="{x0 + length:.0f}" y2="{y1 - length:.0f}"')
        print(f'<path fill="url(#{gid})" d="{d}"/>')
  -->
